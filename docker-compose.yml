# Two services: Postgres, and the app.
#
# For local development run only the database:
#   docker compose up -d db
# and start the app with `npm run dev` so you keep hot reload.
#
# For self-hosting run both. See docs/SELF_HOSTING.md.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: podium
      POSTGRES_PASSWORD: podium
      POSTGRES_DB: podium
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U podium"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://podium:podium@db:5432/podium
    ports:
      - "3000:3000"

volumes:
  pgdata:
